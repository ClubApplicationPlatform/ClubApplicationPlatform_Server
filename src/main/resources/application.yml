spring:
  application:
    name: dp

  profiles:
    active: dev   # 로컬은 dev, Render에서는 prod로 override

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    # Spring Boot 3 + Hibernate 6에서는 dialect 자동 감지됨

jwt:
  secret: "abc123123abc123"

# ================================
# 🧩 DEV (로컬 MySQL)
# ================================
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/club?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: "root"
    password: "@Ab86256653#"

jwt:
  secret: "local-dev-key"

# ================================
# 🧩 TEST (H2)
# ================================
---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "test-secret-key-123456"

# ================================
# 🧩 PROD (Render + PostgreSQL)
# ================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
